apiVersion: database.turborel.com/v1alpha1
kind: Cluster
metadata:
  name: example
spec:
  image: ghcr.io/turborel/turborel:nightly
  instances: 1
  ownerSecret: example-owner
  storage:
    size: 10Gi
  settings:
    MEMORY.BUDGET_BYTES: "1073741824"
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 2Gi
