# example-keys must contain a MASTER file holding 64 hexadecimal digits.
apiVersion: database.turborel.com/v1alpha1
kind: Cluster
metadata:
  name: example
spec:
  image: ghcr.io/turborel/turborel:sha-3af6c384f44669b441e1c471bf7ac75705030d02
  instances: 1
  ownerSecret: example-owner
  keysSecret: example-keys
  storage:
    size: 10Gi
  settings:
    STORAGE.ENCODINGS: LZ4,AES-256-GCM:MASTER
    MEMORY.BUDGET_BYTES: "1073741824"
  resources:
    limits:
      memory: 2Gi
