name: Image
on:
  workflow_run:
    workflows: [Test, Lint]
    branches: [main]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: operator-nightly
  cancel-in-progress: false
env:
  IMAGE: ghcr.io/${{ github.repository }}
  IMAGE_SHA: ${{ github.event.workflow_run.head_sha }}
jobs:
  image:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.IMAGE_SHA }}
      - name: Check the current main revision
        id: revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          checks=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs" --method GET \
            -f head_sha="$IMAGE_SHA" -f event=push -f per_page=100 \
            --jq '[.workflow_runs[] | select(.head_branch == "main" and (.name == "Test" or .name == "Lint"))] | group_by(.name) | map(max_by(.run_number)) | (length == 2 and all(.[]; .conclusion == "success"))')
          if [ "$checks" != "true" ]; then
            echo "Waiting for both Test and Lint to pass."
            exit 0
          fi
          current=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$current" = "$IMAGE_SHA" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "A newer commit is on main; leaving nightly unchanged."
          fi
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.revision.outputs.publish == 'true'
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: steps.revision.outputs.publish == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish both platforms
        if: steps.revision.outputs.publish == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:nightly
            ${{ env.IMAGE }}:sha-${{ env.IMAGE_SHA }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.IMAGE_SHA }}
            org.opencontainers.image.version=nightly
